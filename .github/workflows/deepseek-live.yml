name: DeepSeek live evaluation
run-name: Native C++ - DeepSeek Flash, 10 workers, 60 API requests and selected benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_task:
        description: Benchmark dataset
        default: gsm
        type: choice
        options: [gsm, gpqa, mmlu_pro, ifeval, humanevalplus, mbppplus, aime2025, aime2026]
      benchmark_limit:
        description: Maximum benchmark cases
        default: "10"
        type: string
      public_url:
        description: Optional deployed HTTPS URL for anonymous-session smoke testing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deepseek-live
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.11"
          python-version: "3.12.3"
          enable-cache: true
      - run: uv sync --frozen
      - name: Check API secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Configure the DEEPSEEK_API_KEY repository secret."
            exit 1
          fi
      - name: Prepare Plus execution image
        run: docker build -t llm-eval-python:3.12-numpy2.2.6 -f docker/Dockerfile.numpy docker
      - name: Build native service
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcpp-httplib-dev nlohmann-json3-dev libcurl4-openssl-dev libssl-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Native API60 and selected benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BENCHMARK_TASK: ${{ inputs.benchmark_task }}
          BENCHMARK_LIMIT: ${{ inputs.benchmark_limit }}
        run: uv run --frozen python scripts/native/live_evaluation.py --binary build/server/llm-eval-server --output results/deepseek-flash --task "$BENCHMARK_TASK" --limit "$BENCHMARK_LIMIT"
      - name: Publish evaluation summaries
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          reports = sorted(Path("results/deepseek-flash").rglob("report.md"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              for report in reports:
                  output.write(report.read_text(encoding="utf-8") + "\n\n")
              if not reports:
                  output.write("No evaluation reports were produced; inspect the failed setup step.\n")
          PY
      - name: Public anonymous HTTPS sessions
        if: ${{ inputs.public_url != '' }}
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: uv run --frozen python scripts/native/public_smoke.py --url "$PUBLIC_URL" --output results/deepseek-flash/public-smoke.json
      - name: Upload reports and raw generations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepseek-flash-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/deepseek-flash/
          retention-days: 14
          if-no-files-found: warn
