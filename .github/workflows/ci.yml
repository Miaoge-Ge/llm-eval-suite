name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.11"
          python-version: "3.12.3"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra web
      - name: Lint and type check
        if: runner.os == 'Linux'
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy llm_eval
      - name: Offline regression
        run: |
          node --test tests/web/reasoning_ui.test.cjs
          uv run --frozen python -c "from pathlib import Path; Path('.pytest_cache').mkdir(exist_ok=True)"
          uv run --frozen pytest --basetemp .pytest_cache/ci --junitxml=results/ci/tests.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: results/ci/
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: Real Docker and full Plus grading
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.11"
          python-version: "3.12.3"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Prepare execution images
        run: |
          docker pull python:3.12-slim
          docker build -t llm-eval-python:3.12-numpy2.2.6 -f docker/Dockerfile.numpy docker
      - name: Real container integration
        env:
          LLM_EVAL_DOCKER_TESTS: "1"
        run: |
          uv run --frozen python -c "from pathlib import Path; Path('.pytest_cache').mkdir(exist_ok=True)"
          uv run --frozen pytest tests/integration/test_docker_integration.py --basetemp .pytest_cache/docker --junitxml=results/ci/docker.xml
      - name: Build native production service
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcpp-httplib-dev nlohmann-json3-dev libcurl4-openssl-dev libssl-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Native HTTP, failure accounting and full Docker grading
        env:
          LLM_EVAL_DOCKER_TESTS: "1"
          LLM_EVAL_NATIVE_BINARY: ${{ github.workspace }}/build/server/llm-eval-server
        run: uv run --frozen pytest tests/native --basetemp .pytest_cache/native --junitxml=results/ci/native.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-tests
          path: results/ci/
          retention-days: 14
          if-no-files-found: warn
