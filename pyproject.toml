[project]
name = "llm-eval-suite"
version = "0.1.0"
description = "LLM benchmark performance and API service quality, with model identity verification planned."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langdetect>=1.0.9",
    "numpy==2.2.6",
    "httpx>=0.27.0,<1",
    "openai>=1.52.0,<3",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "types-tqdm>=4.67.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"
llm-eval-web = "llm_eval.web.native:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_eval"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored Google IFEval checkers — kept verbatim, not subject to our lint rules.
extend-exclude = [
    "llm_eval/benchmark/ifeval/instructions.py",
    "llm_eval/benchmark/ifeval/instructions_util.py",
    "llm_eval/benchmark/ifeval/instructions_registry.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["llm_eval"]

[tool.mypy]
python_version = "3.10"
files = ["llm_eval"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Vendored Google IFEval checkers — not type-checked.
[[tool.mypy.overrides]]
module = [
    "llm_eval.benchmark.ifeval.instructions",
    "llm_eval.benchmark.ifeval.instructions_util",
    "llm_eval.benchmark.ifeval.instructions_registry",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["langdetect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
