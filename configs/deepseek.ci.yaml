# GitHub Actions injects the repository secret into this environment variable.
base_url: https://api.deepseek.com/v1
api_key: ${DEEPSEEK_API_KEY}
model_name: deepseek-flash
workers: 10
timeout_seconds: 120
execution_timeout_seconds: 20

# DeepSeek Flash emits reasoning by default; record and request that mode explicitly.
thinking_enabled: true

# Reasoning and visible answers share this budget. The smaller suite defaults
# exhausted it during reasoning in the initial live run (retained in Actions).
max_output_tokens: 16384
execution:
  backend: docker
  image: llm-eval-python:3.12-numpy2.2.6
