# Copy this file to a real config (e.g. configs/my-model.yaml) and fill in values.
# Secrets are read from environment variables via ${ENV_VAR} placeholders,
# so the API key is never written to disk.
base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
api_key: ${OPENAI_API_KEY}
model_name: gpt-4.1-mini

# Concurrency for the evaluation run.
workers: 10

# Per-request HTTP timeout in seconds.
timeout_seconds: 120

# Caps how long a generated code sample may run during execution-based grading.
execution_timeout_seconds: 20

# Code tasks require Docker Linux containers and a locally prepared image.
# Docker Desktop on Windows must use the Linux container engine.
# Prepare once: docker pull python:3.12-slim
# Use an image digest instead of a tag for reproducible deployments.
execution:
  backend: docker        # local is an explicit opt-in for trusted code only
  # Defaults: python:3.12-slim, or llm-eval-python:3.12-numpy2.2.6 for Plus tasks.
  # Build Plus image: docker build -t llm-eval-python:3.12-numpy2.2.6 -f docker/Dockerfile.numpy docker
  # image: python:3.12-slim  # optional override; Plus requires NumPy 2.2.6
  memory_mb: 256         # per execution; includes all container processes
  cpus: 1.0             # Docker CPU quota
  pids_limit: 64
  max_output_bytes: 1048576  # combined stdout and stderr
  tmpfs_mb: 32           # size of each writable container tmpfs

# Set to true to request reasoning/thinking from providers that support it.
thinking_enabled: false

# Optional: low | medium | high | max (only sent when thinking_enabled is true).
reasoning_effort:
